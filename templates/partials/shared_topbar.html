<header id="top-bar" class="shared-app-topbar" role="banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 14px;background:var(--bg-card,#161b22);border-bottom:1px solid var(--border,#30363d);color:var(--text,#e6edf3);flex-shrink:0;flex-wrap:wrap;z-index:20;">
    <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-weight:600;font-size:13px;">🌍 <span id="shared-scenario-name">{{ scenario_name or 'VirtualWorld' }}</span></span>
        <button type="button" id="shared-commit-btn" class="btn btn-sm btn-green" style="font-size:11px;padding:2px 8px;" title="Commit live world changes into scenario">📦 Commit</button>
    </div>
    <nav aria-label="Workspace pages" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span id="shared-sky-time" class="sky-time" style="font-family:monospace;font-size:12px;color:var(--text-dim,#8b949e);margin-right:6px;">🕐 --:--</span>
        <a class="btn btn-sm" href="/" style="font-size:11px;text-decoration:none;{{ 'border-color:#58a6ff;color:#58a6ff;' if active_page == 'world' else '' }}">🌍 World</a>
        <a class="btn btn-sm" href="/commons" style="font-size:11px;text-decoration:none;{{ 'border-color:#58a6ff;color:#58a6ff;' if active_page == 'commons' else '' }}">💬 Commons</a>
        <a class="btn btn-sm" href="/bench" style="font-size:11px;text-decoration:none;{{ 'border-color:#58a6ff;color:#58a6ff;' if active_page == 'benchmark' else '' }}">📊 Benchmark</a>
        <a class="btn btn-sm" href="/soak" style="font-size:11px;text-decoration:none;{{ 'border-color:#58a6ff;color:#58a6ff;' if active_page == 'soak' else '' }}">🧪 Soak Lab</a>
    </nav>
    <div style="display:flex;align-items:center;gap:6px;">
        <button type="button" id="shared-restart-btn" class="btn btn-sm btn-red" style="font-size:11px;padding:2px 8px;" title="Restart scenario and reset all world state" aria-label="Restart scenario">🔄 Restart</button>
        <button type="button" id="shared-settings-btn" class="btn btn-sm" style="font-size:11px;padding:2px 8px;" title="Quick Settings" aria-label="Quick Settings">⚙️ Settings</button>
    </div>
</header>

<div id="shared-settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shared-settings-title" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);align-items:center;justify-content:center;z-index:2000;">
    <div class="modal-content" style="background:var(--bg-card,#161b22);border:1px solid var(--border,#30363d);color:var(--text,#e6edf3);border-radius:8px;max-width:440px;width:92%;padding:16px 20px;box-shadow:0 12px 32px rgba(0,0,0,0.5);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid var(--border,#30363d);padding-bottom:8px;">
            <h3 id="shared-settings-title" style="margin:0;font-size:15px;font-weight:600;">⚙️ Quick Settings</h3>
            <button type="button" id="shared-settings-close" class="modal-close" aria-label="Close settings" style="background:none;border:none;color:var(--text-dim,#8b949e);font-size:20px;cursor:pointer;line-height:1;">&times;</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;font-size:13px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="shared-set-show-raw-llm">
                <span>Show Raw LLM</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="shared-set-commons-auto-reply">
                <span>Commons: Auto-reply on message</span>
            </label>
            <hr style="border:none;border-top:1px solid var(--border,#30363d);margin:2px 0;">
            <label style="display:flex;flex-direction:column;gap:4px;">
                <span style="font-size:12px;color:var(--text-dim,#8b949e);">LLM Base URL</span>
                <input type="text" id="shared-set-api-base" placeholder="http://localhost:1234/v1" style="padding:6px 8px;border-radius:4px;border:1px solid var(--border,#30363d);background:var(--bg-input,#0d1117);color:var(--text,#e6edf3);font-size:12px;">
            </label>
            <label style="display:flex;flex-direction:column;gap:4px;">
                <span style="font-size:12px;color:var(--text-dim,#8b949e);">Model</span>
                <input type="text" id="shared-set-model" placeholder="glm-4-9b-0414" style="padding:6px 8px;border-radius:4px;border:1px solid var(--border,#30363d);background:var(--bg-input,#0d1117);color:var(--text,#e6edf3);font-size:12px;">
            </label>
            <label style="display:flex;flex-direction:column;gap:4px;">
                <span style="font-size:12px;color:var(--text-dim,#8b949e);">API Key</span>
                <input type="password" id="shared-set-api-key" autocomplete="off" placeholder="not-needed" style="padding:6px 8px;border-radius:4px;border:1px solid var(--border,#30363d);background:var(--bg-input,#0d1117);color:var(--text,#e6edf3);font-size:12px;">
            </label>
            <div id="shared-settings-status" style="font-size:11px;color:var(--text-dim,#8b949e);min-height:14px;"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border,#30363d);">
            <a href="/?open=settings" class="btn btn-sm" style="font-size:11px;text-decoration:none;" title="Open full Settings in World Editor">Full Editor Settings ↗</a>
            <div style="display:flex;align-items:center;gap:6px;">
                <button type="button" id="shared-settings-cancel" class="btn btn-sm btn-secondary">Cancel</button>
                <button type="button" id="shared-settings-save" class="btn btn-sm btn-green">💾 Save</button>
            </div>
        </div>
    </div>
</div>
