<!DOCTYPE html>
<html lang="en" class="stage-chat-doc">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Chat — VirtualWorld</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/stage-chat.css">
</head>
<body class="stage-chat-body" data-app-version="{{ app_version or '' }}">

<header class="stage-chat-topbar">
    <div class="stage-chat-brand">
        <span class="stage-chat-brand-icon">💬</span>
        <span class="stage-chat-brand-title">Stage Chat</span>
        <span class="stage-chat-brand-sub">Phone App Perspective</span>
    </div>
    <div class="stage-chat-topbar-center">
        <span id="stage-status-chip" class="stage-chat-btn" style="cursor: default; pointer-events: none;">Active</span>
    </div>
    <div class="stage-chat-top-actions">
        <button type="button" id="stage-pause-btn" class="stage-chat-btn">⏸ Pause</button>
        <button type="button" id="stage-step-btn" class="stage-chat-btn">▶ Step Next</button>
        <a class="stage-chat-btn" href="/" title="Back to the world editor">← Editor</a>
    </div>
</header>

<main class="stage-chat-layout">
    <!-- Left: Participants & Roster -->
    <aside class="stage-chat-sidebar">
        <div class="stage-panel-header">Participants & Pacing</div>
        <div id="stage-participants-list">
            <!-- Rendered by StageChatUI -->
        </div>
    </aside>

    <!-- Center: Main Chat Feed -->
    <section class="stage-chat-main">
        <div id="stage-chat-feed" class="stage-chat-log">
            <!-- Messages rendered by StageChatUI -->
        </div>
        <form id="stage-chat-form" class="stage-chat-input-row" onsubmit="event.preventDefault();">
            <input type="text" id="stage-chat-input" class="stage-chat-input" placeholder="Type a message as User..." autocomplete="off">
            <button type="submit" id="stage-send-btn" class="stage-chat-btn stage-chat-btn-primary">Send</button>
        </form>
    </section>

    <!-- Right: Monologue & Inner State -->
    <aside class="stage-chat-monologue">
        <div class="stage-panel-header">Inner Monologues & Deliberations</div>
        <div id="stage-monologue-list">
            <!-- Inner thoughts rendered by StageChatUI -->
        </div>
    </aside>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/event-bus.js"></script>
<script src="/static/js/storage.js"></script>
<script src="/static/js/config.js"></script>
<script src="/static/js/llm-client.js"></script>

<script src="/static/js/stage-chat/stage-chat-api.js"></script>
<script src="/static/js/stage-chat/stage-chat-state.js"></script>
<script src="/static/js/stage-chat/stage-chat-ui.js"></script>
<script src="/static/js/stage-chat/stage-chat-agent.js"></script>
<script src="/static/js/stage-chat/stage-chat-app.js"></script>

</body>
</html>
