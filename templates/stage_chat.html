<!DOCTYPE html>
<html lang="en" class="stage-chat-doc">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Commons — VirtualWorld</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/stage-chat.css">
</head>
<body class="stage-chat-body" data-app-version="{{ app_version or '' }}">

<header class="stage-chat-topbar">
    <div class="stage-chat-brand">
        <span class="stage-chat-brand-icon" aria-hidden="true">✳</span>
        <span class="stage-chat-brand-title">The Commons</span>
        <span class="stage-chat-brand-sub">a place to talk</span>
    </div>
    <div class="stage-chat-topbar-center">
        <label class="stage-perspective-label" for="stage-perspective">Phone owner</label>
        <select id="stage-perspective" class="stage-chat-select" aria-label="View conversations as"></select>
        <span id="stage-status-chip" class="stage-chat-status">Active</span>
        <span id="stage-rate-estimate" class="stage-rate-estimate" aria-live="polite"></span>
    </div>
    <div class="stage-chat-top-actions">
        <button type="button" id="stage-pause-btn" class="stage-chat-btn">⏸ Pause</button>
        <button type="button" id="stage-step-btn" class="stage-chat-btn">▶ Step Next</button>
        <a class="stage-chat-btn" href="/" title="Back to the world editor">← Editor</a>
    </div>
</header>

<main class="stage-chat-layout">
    <aside class="stage-chat-sidebar" aria-label="Conversations">
        <div class="stage-sidebar-heading">
            <div>
                <div class="stage-eyebrow">INBOX</div>
                <h2>Conversations</h2>
            </div>
            <button type="button" id="stage-new-group" class="stage-icon-btn" aria-label="Create private group" title="New group">＋</button>
        </div>
        <button type="button" id="stage-new-dm" class="stage-new-dm">✉ New direct message</button>
        <nav id="stage-channel-list" class="stage-channel-list" aria-label="Your conversations"></nav>

        <details class="stage-agent-controls">
            <summary>Characters & pacing</summary>
            <div id="stage-participants-list"></div>
        </details>
    </aside>

    <section class="stage-chat-main" aria-label="Selected conversation">
        <header class="stage-conversation-header">
            <div class="stage-conversation-avatar" id="stage-channel-avatar" aria-hidden="true">#</div>
            <div class="stage-conversation-title-wrap">
                <h1 id="stage-channel-name">Public</h1>
                <div id="stage-channel-subtitle" class="stage-conversation-subtitle">Everyone can join this conversation</div>
            </div>
            <div id="stage-channel-member-count" class="stage-member-count"></div>
        </header>
        <div id="stage-chat-feed" class="stage-chat-log" aria-live="polite" aria-label="Messages"></div>
        <form id="stage-chat-form" class="stage-chat-input-row" onsubmit="event.preventDefault();">
            <label class="stage-composer-label" for="stage-chat-input">Message as <span id="stage-composer-identity">User</span></label>
            <div class="stage-composer-row">
                <input type="text" id="stage-chat-input" class="stage-chat-input" placeholder="Write a message…" autocomplete="off">
                <button type="submit" id="stage-send-btn" class="stage-chat-btn stage-chat-btn-primary">Send</button>
            </div>
        </form>
    </section>

    <aside class="stage-chat-details" aria-label="Conversation details">
        <div class="stage-panel-header">People here</div>
        <div id="stage-channel-members" class="stage-channel-members"></div>
        <div id="stage-member-editor" class="stage-member-editor"></div>
        <div class="stage-details-note">Private conversations are visible only from a member’s phone.</div>
    </aside>
</main>

<dialog id="stage-group-dialog" class="stage-dialog">
    <form id="stage-group-form" method="dialog">
        <div class="stage-dialog-heading">
            <div>
                <div class="stage-eyebrow">PRIVATE SPACE</div>
                <h2>Start a group</h2>
            </div>
            <button type="button" id="stage-group-close" class="stage-icon-btn" aria-label="Close">×</button>
        </div>
        <label class="stage-field-label" for="stage-group-name">Group name</label>
        <input id="stage-group-name" class="stage-chat-input" maxlength="80" required placeholder="e.g. Night watch">
        <div class="stage-field-label">Invite characters</div>
        <div id="stage-group-roster" class="stage-group-roster"></div>
        <div class="stage-dialog-actions">
            <button type="button" id="stage-group-cancel" class="stage-chat-btn">Cancel</button>
            <button type="submit" class="stage-chat-btn stage-chat-btn-primary">Create group</button>
        </div>
        <div id="stage-group-error" class="stage-form-error" role="alert"></div>
    </form>
</dialog>

<dialog id="stage-dm-dialog" class="stage-dialog">
    <form id="stage-dm-form" method="dialog">
        <div class="stage-dialog-heading">
            <div>
                <div class="stage-eyebrow">ONE TO ONE</div>
                <h2>Start a direct message</h2>
            </div>
            <button type="button" id="stage-dm-close" class="stage-icon-btn" aria-label="Close">×</button>
        </div>
        <label class="stage-field-label" for="stage-dm-recipient">Choose a character</label>
        <select id="stage-dm-recipient" class="stage-chat-select" required></select>
        <div class="stage-dialog-actions">
            <button type="button" id="stage-dm-cancel" class="stage-chat-btn">Cancel</button>
            <button type="submit" class="stage-chat-btn stage-chat-btn-primary">Open conversation</button>
        </div>
        <div id="stage-dm-error" class="stage-form-error" role="alert"></div>
    </form>
</dialog>

<script src="/static/js/api.js"></script>
<script src="/static/js/event-bus.js"></script>
<script src="/static/js/storage.js"></script>
<script src="/static/js/agent/simultaneous.js"></script>
<script src="/static/js/config.js"></script>
<script src="/static/js/llm-client.js"></script>
<script src="/static/js/shared/json-utils.js"></script>
<script src="/static/js/agent/action-normalizer.js"></script>
<script src="/static/js/agent/response-parser.js"></script>
<script src="/static/js/agent/prompt-builder/helpers.js"></script>
<script src="/static/js/agent/prompt-builder/character-state.js"></script>
<script src="/static/js/agent/prompt-builder/context-sections.js"></script>
<script src="/static/js/agent/prompt-builder/turn-prompts.js"></script>

<script src="/static/js/stage-chat/stage-chat-api.js"></script>
<script src="/static/js/stage-chat/stage-chat-state.js"></script>
<script src="/static/js/stage-chat/stage-chat-ui.js"></script>
<script src="/static/js/stage-chat/stage-chat-agent.js"></script>
<script src="/static/js/stage-chat/stage-chat-app.js"></script>

</body>
</html>
